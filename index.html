<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sushmita Poudel</title>
<meta name="description" content="Portfolio of Sushmita Poudel — coming soon.">
<style>
  :root {
    --bg: #ffffff;
    --surface: #f6f7f9;
    --text: #15181d;
    --muted: #5b6472;
    --line: #e3e6ea;
    --accent: #2f6df6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115;
      --surface: #171a20;
      --text: #eef1f5;
      --muted: #9aa4b2;
      --line: #262b33;
      --accent: #6c9bff;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    line-height: 1.6;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 16px;
  }
  main {
    width: 100%;
    max-width: 560px;
    text-align: center;
  }
  .badge {
    display: inline-block;
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 999px;
    padding: 6px 14px;
    margin-bottom: 28px;
  }
  h1 {
    font-size: clamp(2rem, 7vw, 3rem);
    line-height: 1.15;
    margin: 0 0 12px;
    letter-spacing: -0.02em;
  }
  .role {
    font-size: clamp(1rem, 3.5vw, 1.125rem);
    color: var(--muted);
    margin: 0 0 32px;
  }
  .card {
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 14px;
    padding: 24px;
    text-align: left;
  }
  .card p {
    margin: 0;
    color: var(--muted);
    font-size: 15px;
  }
  .links {
    margin-top: 32px;
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .links a {
    color: var(--text);
    text-decoration: none;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 15px;
    transition: border-color .15s ease, color .15s ease;
  }
  .links a:hover,
  .links a:focus-visible {
    border-color: var(--accent);
    color: var(--accent);
  }
  footer {
    margin-top: 40px;
    font-size: 13px;
    color: var(--muted);
  }
</style>
</head>
<body>
<main>
  <span class="badge">Coming soon</span>

  <h1>Sushmita Poudel</h1>
  <p class="role">Web Developer &middot; Kathmandu, Nepal</p>

  <div class="card">
    <p>
      This site is being rebuilt. The full portfolio — projects, background
      and contact details — will live here shortly.
    </p>
  </div>

  <div class="links">
    <a href="https://github.com/sushmitapoudel">GitHub</a>
    <!-- Add more when you're ready, e.g.:
    <a href="https://www.linkedin.com/in/your-handle">LinkedIn</a>
    <a href="mailto:you@example.com">Email</a>
    -->
  </div>

  <footer>poudelsushmita.com.np</footer>
</main>
</body>
</html>
